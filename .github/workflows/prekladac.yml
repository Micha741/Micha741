name: Překladač – instalátor pro Windows

on:
  push:
    branches: [main]
    paths: ["prekladac/**", ".github/workflows/prekladac.yml"]
  pull_request:
    paths: ["prekladac/**", ".github/workflows/prekladac.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: prekladac
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Testy
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Čtení nahlas – český hlas Piper (skutečné stažení a namluvení věty)
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          python -c "import sys; sys.path.insert(0, '.'); import tts_win as t; v = t.download_piper('cs', print); out = r'$env:RUNNER_TEMP\veta.wav'; t.piper_synthesize('Dobrý den, tohle je český hlas pro čtení knih.', v['model'], 1.0, out); s = t.wav_seconds(out); print('délka', s); assert s > 1.5; print([x['name'] for x in t.list_voices()])"

      - name: Sestavení programu (složka, bez rozbalování do Temp)
        run: |
          "VERSION = `"1.0.$env:GITHUB_RUN_NUMBER`"" | Set-Content -Encoding utf8 version.py
          python tools/make_version_info.py build/version_info.txt
          # DLL knihovny sentencepiece leží vedle balíčku ve složce sentencepiece.libs (delvewheel) – přibalit ručně
          $spl = python -c "import sentencepiece, os; print(os.path.normpath(os.path.join(os.path.dirname(sentencepiece.__file__), os.pardir, 'sentencepiece.libs')))"
          "sentencepiece.libs: $spl"; Get-ChildItem $spl
          python -m PyInstaller --noconfirm --onedir --windowed --name Prekladac `
            --add-binary "$spl;sentencepiece.libs" `
            --version-file "$PWD\build\version_info.txt" `
            --collect-all ctranslate2 --collect-all sentencepiece --collect-data sacremoses `
            --collect-all pypdfium2 --collect-all pypdfium2_raw --hidden-import comtypes.client --hidden-import winsound --exclude-module tkinter `
            --icon "$PWD\assets\icon.ico" --add-data "$PWD\assets;assets" `
            --distpath build\dist --workpath build\work --specpath build app.py
          Move-Item build\dist\Prekladac build\app

      - name: Calibre, Tesseract a Inno Setup
        run: |
          # Chocolatey občas vrátí 504 – každý balíček zkusíme víckrát a ověříme, že je nainstalovaný
          $need = @{ calibre = "$env:ProgramFiles\Calibre2\ebook-convert.exe";
                     tesseract = "$env:ProgramFiles\Tesseract-OCR\tesseract.exe"; innosetup = $null }
          foreach ($p in $need.Keys) {
            for ($i = 1; $i -le 5; $i++) {
              choco install $p -y --no-progress
              $ok = ($LASTEXITCODE -eq 0) -and (-not $need[$p] -or (Test-Path $need[$p]))
              if ($ok) { break }
              if ($i -eq 5) { throw "choco install $p selhal ($LASTEXITCODE)" }
              "Instalace $p (pokus $i) selhala, zkusím znovu…"
              Start-Sleep -Seconds (20 * $i)
            }
          }

      - name: Přibalení Tesseractu a slovníku (Calibre už se nepřibaluje)
        run: |
          function Find-Exe($name, $preferred) {
            if (Test-Path $preferred) { return $preferred }
            $hit = Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { throw "$name nenalezen" }
            return $hit.FullName
          }
          # stahování s opakováním – GitHub občas vrátí 504 nebo spojení spadne
          function Get-File($url, $out) {
            for ($i = 1; $i -le 5; $i++) {
              try { Invoke-WebRequest $url -OutFile $out; return }
              catch {
                if ($i -eq 5) { throw }
                "Pokus $i selhal ($($_.Exception.Message)), zkusím znovu…"
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }
          $cal = Find-Exe 'ebook-convert.exe' "$env:ProgramFiles\Calibre2\ebook-convert.exe"
          $tes = Find-Exe 'tesseract.exe' "$env:ProgramFiles\Tesseract-OCR\tesseract.exe"
          Copy-Item (Split-Path $tes) build\Tesseract-OCR -Recurse
          New-Item -ItemType Directory -Force build\Tesseract-OCR\tessdata | Out-Null
          foreach ($l in 'eng','ces','slk','deu','pol','fra','spa','ita','rus','ukr','hun') {
            $out = "build\Tesseract-OCR\tessdata\$l.traineddata"
            if (-not (Test-Path $out)) {
              Get-File "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$l.traineddata" $out
            }
          }
          # český slovník pro kontrolu pravopisu a návrhy slov (LibreOffice, GPL)
          New-Item -ItemType Directory -Force build\dict | Out-Null
          # přesná verze (commit) kvůli licenci GPL – odkaz na zdroj se zapíše do dict\SOURCE.txt
          $sha = (git ls-remote https://github.com/LibreOffice/dictionaries HEAD).Split("`t")[0]
          if (-not $sha) { $sha = 'master' }
          foreach ($e in 'aff','dic') {
            Get-File "https://raw.githubusercontent.com/LibreOffice/dictionaries/$sha/cs_CZ/cs_CZ.$e" "build\dict\cs_CZ.$e"
          }
          # licence (GPL v2) a autoři slovníku – soubor README_cs.txt ze stejného zdroje
          Get-File "https://raw.githubusercontent.com/LibreOffice/dictionaries/$sha/cs_CZ/README_cs.txt" "build\dict\README_cs.txt"
          Set-Content -Encoding utf8 build\dict\SOURCE.txt "Český slovník Hunspell (GPL). Zdroj této verze: https://github.com/LibreOffice/dictionaries/tree/$sha/cs_CZ"
          "Calibre: $cal"; "Tesseract: $tes"
          & build\Tesseract-OCR\tesseract.exe --list-langs
          # systémový Tesseract odstraníme, aby zkouška níže používala jen přibalený; Calibre zůstává
          # nainstalované jako u uživatele, který si ho volitelně doinstaluje (AZW3, KFX…)
          choco uninstall tesseract -y --no-progress

      - name: Sestavení instalátoru Prekladac-Setup.exe
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.$env:GITHUB_RUN_NUMBER installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC selhal ($LASTEXITCODE)" }
          Get-Item dist\Prekladac-Setup.exe | Select-Object Name, Length
          # údaje souboru (Vlastnosti → Podrobnosti): verze souboru nesmí být 0.0.0.0
          $want = "1.0.$env:GITHUB_RUN_NUMBER"
          foreach ($f in 'dist\Prekladac-Setup.exe', 'build\app\Prekladac.exe') {
            $vi = (Get-Item $f).VersionInfo
            "$f : FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion) Copyright=$($vi.LegalCopyright)"
            if (-not $vi.FileVersion.StartsWith($want)) { throw "$f má verzi souboru $($vi.FileVersion), čekáno $want" }
            if (-not $vi.LegalCopyright) { throw "$f nemá autorská práva" }
          }

      - name: Zkouška nainstalovaného programu
        run: |
          # chyba kteréhokoli příkazu (python, choco…) ukončí zkoušku – nic se nesmí přeskočit potichu
          $PSNativeCommandUseErrorActionPreference = $true
          # instalace pro všechny do výchozí složky C:\Program Files\Prekladac (jako u uživatele)
          $dir = "$env:ProgramFiles\Prekladac"
          $p = Start-Process dist\Prekladac-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalace skončila s kódem $($p.ExitCode)" }
          $exe = "$dir\Prekladac.exe"
          if (-not (Test-Path $exe)) { throw "Program se nenainstaloval do $dir" }
          $v = Start-Process $exe -ArgumentList '--version-file','version.txt' -Wait -PassThru
          Get-Content version.txt
          $g = Start-Process $exe -ArgumentList '--gui-selftest','gui.txt' -Wait -PassThru
          Get-Content gui.txt
          if ($g.ExitCode -ne 0) { throw "Okno programu (Qt) se nepodařilo sestavit" }
          python -c "import docx; d = docx.Document(); d.add_paragraph('Hello world'); d.save('smoke.docx')"
          python -c "from PIL import Image, ImageDraw, ImageFont; im = Image.new('RGB', (1400, 220), 'white'); ImageDraw.Draw(im).text((40, 60), 'The quick brown fox jumps.', fill='black', font=ImageFont.truetype('arial.ttf', 64)); im.save('smoke.png')"
          function Run($argsList, $log) {
            $p = Start-Process $exe -ArgumentList ($argsList + @('--log', $log)) -Wait -PassThru
            if (Test-Path $log) { Get-Content $log -Encoding utf8 }
            if ($p.ExitCode -ne 0) { throw "Prekladac.exe $argsList skončil s kódem $($p.ExitCode)" }
          }
          # 1) převod bez Calibre (DOCX -> EPUB, MOBI, PDB, PDF vlastním kódem)
          Run @('smoke.docx', '--convert-only', '--to', 'epub', '--out-dir', 'smoke_out') 'smoke1.log'
          if (-not (Get-ChildItem smoke_out -Filter *.epub)) { throw 'EPUB nevznikl' }
          foreach ($f in 'mobi','pdb','pdf') {
            Run @('smoke.docx', '--convert-only', '--to', $f, '--out-dir', 'smoke_out') "smoke_$f.log"
            if (-not (Get-ChildItem smoke_out -Filter "*.$f")) { throw "$f nevznikl" }
            if (-not (Select-String -Path "smoke_$f.log" -Pattern 'bez Calibre' -Quiet)) { throw "$f se nepřevedl vlastním kódem" }
          }
          # PDF z nainstalovaného programu musí mít textovou vrstvu (hledání, kopírování textu)
          python -c "import glob, pypdf; t = ''.join(p.extract_text() or '' for f in glob.glob('smoke_out/*.pdf') for p in pypdf.PdfReader(f).pages); print(repr(t[:200])); assert 'Hello' in t, 'PDF nemá text'"
          # 2) OCR přes přibalený Tesseract (obrázek -> DOCX)
          Run @('smoke.png', '--convert-only', '--ocr', 'tesseract', '--ocr-lang', 'eng', '--out-dir', 'smoke_out') 'smoke2.log'
          python -c "import docx, glob; t = ' '.join(p.text for f in glob.glob('smoke_out/smoke*.docx') for p in docx.Document(f).paragraphs); print(t); assert 'brown fox' in t"
          # 3) kniha s obsahem a odkazy -> EPUB přes přibalené Calibre; odkazy musí zůstat
          python tests\ci_check_epub_links.py "$env:ProgramFiles\Calibre2\ebook-convert.exe"
          # 4) stažení a instalace pluginu KFX Input do přibaleného Calibre
          python -c "import sys; sys.path.insert(0, '.'); import components; c = r'$env:ProgramFiles\Calibre2\ebook-convert.exe'; print('CA:', components.calibre_ca_file(c)); components.install_kfx_plugin(c, print); assert components.calibre_kfx_plugin(c) is True, 'plugin chybí'"
          # 5a) Uložit jako z editoru knihy: MOBI, RTF, PDF přes přibalené Calibre (TXT/ODT/DOCX bez Calibre)
          python -c "import sys, pathlib; sys.path.insert(0, '.'); import book_writer as bw; p = {'description': 'x', 'words': 100, 'outline': {'title': 'Kniha', 'chapters': [{'title': 'Jedna', 'summary': ''}]}, 'chapters': [{'text': 'Ahoj svete.', 'summary': ''}]}; out = [bw.save_as(p, f'saveas_out/kniha.{e}', print, r'$env:ProgramFiles\Calibre2\ebook-convert.exe') for e in ('mobi', 'rtf', 'pdf', 'docx', 'txt')]; print(out); assert all(pathlib.Path(f).stat().st_size > 20 for f in out)"
          # 5c) otevření hotové knihy v jiném formátu (MOBI, PDB) přes přibalené Calibre → projekt s kapitolami
          python -c "import sys, pathlib; sys.path.insert(0, '.'); import book_writer as bw, book_import as imp; cal = r'$env:ProgramFiles\Calibre2\ebook-convert.exe'; p = {'description': 'x', 'words': 100, 'outline': {'title': 'Kniha', 'chapters': [{'title': 'Jedna', 'summary': ''}, {'title': 'Dva', 'summary': ''}]}, 'chapters': [{'text': 'Prvni kapitola knihy s textem.', 'summary': ''}, {'text': 'Druha kapitola knihy s textem.', 'summary': ''}]}; m = bw.save_as(p, 'import_out/kniha.mobi', print, cal); bw.save_as(p, 'import_out/kniha.txt', print, cal); import subprocess; subprocess.run([cal, 'import_out/kniha.txt', 'import_out/kniha.pdb'], check=True); res = [imp.import_book(f, cal) for f in (m, 'import_out/kniha.pdb')]; print([[c['text'][:30] for c in r['chapters']] for r in res]); assert all(any('Druha kapitola' in c['text'] for c in r['chapters']) for r in res)"
          # 5b) obálka a obrázek: EPUB a MOBI s obálkou e-knihy vlastním kódem, AZW3 přes Calibre
          python tests\ci_check_cover.py "$env:ProgramFiles\Calibre2\ebook-convert.exe"
          # 5e) vzájemná kontrola formátů s Calibre (EPUB, MOBI, AZW3, RTF, FB2, ODT, HTMLZ, DOCX, PDB)
          python tests\ci_check_formats_calibre.py "$env:ProgramFiles\Calibre2\ebook-convert.exe"
          # 5d) bez Calibre vůbec: odinstalovat a převést EPUB → MOBI → EPUB, chybějící Calibre jen u AZW3
          choco uninstall calibre -y --no-progress
          Get-ChildItem smoke_out -Filter *.epub | Select-Object -First 1 | Copy-Item -Destination nocal.epub
          Run @('nocal.epub', '--convert-only', '--to', 'mobi', '--out-dir', 'nocal_out') 'nocal1.log'
          Get-ChildItem nocal_out -Filter *.mobi | Select-Object -First 1 | Copy-Item -Destination nocal.mobi
          Run @('nocal.mobi', '--convert-only', '--to', 'epub', '--out-dir', 'nocal_out') 'nocal2.log'
          if (-not (Get-ChildItem nocal_out -Filter *.epub)) { throw 'MOBI -> EPUB bez Calibre nevznikl' }
          python tests\ci_check_no_calibre.py
          # 5) offline překlad (Argos): stažení balíčků jako volba v instalátoru, překlad EN→CS a DE→(EN)→CS
          $o = Start-Process $exe -ArgumentList '--install-offline','en_cs,de_en','offline.txt' -Wait -PassThru
          Get-Content offline.txt -Encoding utf8
          if ($o.ExitCode -ne 0) { throw "Offline balíčky se nepodařilo stáhnout" }
          Set-Content -Encoding utf8 off_en.txt "The quick brown fox jumps over the lazy dog. I would like a cup of tea, please."
          Set-Content -Encoding utf8 off_de.txt "Der schnelle braune Fuchs springt über den faulen Hund. Ich möchte bitte eine Tasse Tee."
          Run @('off_en.txt', '--engine', 'offline', '--lang', 'čeština', '--out-dir', 'off_out') 'off1.log'
          Run @('off_de.txt', '--engine', 'offline', '--lang', 'čeština', '--out-dir', 'off_out') 'off2.log'
          python -c "import glob, re; fs = sorted(glob.glob('off_out/*.txt')); t = [open(f, encoding='utf-8-sig').read() for f in fs]; print(fs, t); assert len(t) == 2 and all(re.search('[ěščřžýáíéůú]', x) for x in t), 'offline překlad nevrátil češtinu'"

      - uses: actions/upload-artifact@v4
        with:
          name: Prekladac-Setup
          path: prekladac/dist/Prekladac-Setup.exe

      - name: Zveřejnění v Releases (jen po sloučení do main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prekladac-latest --yes --cleanup-tag || true
          gh release create prekladac-latest dist/Prekladac-Setup.exe \
            --title "Překladač 1.0.${{ github.run_number }}" \
            --target "$GITHUB_SHA" \
            --notes "Verze 1.0.${{ github.run_number }}. Stáhněte Prekladac-Setup.exe a nainstalujte. Obsahuje Tesseract, převody EPUB/MOBI/PDB/DOCX/PDF bez Calibre (Calibre je volitelné pro AZW3/KFX), Python není potřeba. Návod: https://github.com/${{ github.repository }}/tree/main/prekladac#readme"
