name: Překladač – sestavení pro Windows

on:
  push:
    branches: [main]
    paths: ["prekladac/**", ".github/workflows/prekladac.yml"]
  pull_request:
    paths: ["prekladac/**", ".github/workflows/prekladac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prekladac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Testy
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Sestavení Prekladac.exe
        run: >-
          python -m PyInstaller --noconfirm --onefile --windowed --name Prekladac
          --collect-all tkinterdnd2 --collect-all pypdfium2 --collect-all pypdfium2_raw app.py

      - name: Kontrola, že se Prekladac.exe spustí
        shell: pwsh
        run: |
          python -c "import docx; d = docx.Document(); d.add_paragraph('test'); d.save('smoke.docx')"
          $p = Start-Process -FilePath dist\Prekladac.exe -ArgumentList 'smoke.docx','--convert-only','--out-dir','smoke_out','--log','smoke.log' -Wait -PassThru
          if (Test-Path smoke.log) { Get-Content smoke.log -Encoding utf8 }
          if ($p.ExitCode -ne 0) { throw "Prekladac.exe skončil s kódem $($p.ExitCode)" }
          if ((Get-ChildItem smoke_out -Filter *.docx).Count -ne 1) { throw 'Výstupní soubor nevznikl' }

      - uses: actions/upload-artifact@v4
        with:
          name: Prekladac
          path: prekladac/dist/Prekladac.exe

      - name: Zveřejnění v Releases (jen po sloučení do main)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prekladac-latest --yes --cleanup-tag || true
          gh release create prekladac-latest dist/Prekladac.exe \
            --title "Překladač – nejnovější verze" \
            --target "$GITHUB_SHA" \
            --notes "Stáhněte Prekladac.exe a spusťte ho, Python není potřeba. Návod: https://github.com/${{ github.repository }}/tree/main/prekladac#readme"
